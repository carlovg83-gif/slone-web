<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="neonV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E3FF00"/>
      <stop offset="100%" stop-color="#9AD600"/>
    </linearGradient>

    <filter id="glowV2" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Máscara de Doble Pista Concéntrica (3 Anillos de Audio) -->
    <mask id="maskV2">
      <rect width="600" height="600" fill="#FFFFFF"/>
      
      <!-- Hueco central interior (R=92) -->
      <circle cx="300" cy="340" r="92" fill="#000000"/>

      <!-- Muesca superior en ápice (R=8) -->
      <circle cx="300" cy="170" r="8" fill="#000000"/>

      <!-- Pista 1: Canal interior fino (R=120, ancho 3.5px) -->
      <circle cx="300" cy="340" r="120" fill="none" stroke="#000000" stroke-width="3.5"/>

      <!-- Pista 2: Canal exterior fino (R=146, ancho 3.5px) -->
      <circle cx="300" cy="340" r="146" fill="none" stroke="#000000" stroke-width="3.5"/>

      <!-- Puentes de fase transversales a 90° (arriba, abajo, izquierda, derecha) -->
      <g stroke="#FFFFFF" stroke-width="7">
        <line x1="300" y1="185" x2="300" y2="255"/>
        <line x1="300" y1="425" x2="300" y2="495"/>
        <line x1="145" y1="340" x2="215" y2="340"/>
        <line x1="385" y1="340" x2="455" y2="340"/>
      </g>
    </mask>
  </defs>

  <rect width="600" height="600" fill="#000000"/>

  <g filter="url(#glowV2)">
    <!-- 1. ANILLO CON TRIPLE PISTA DE PRECISIÓN -->
    <circle cx="300" cy="340" r="170" fill="url(#neonV2)" mask="url(#maskV2)"/>

    <!-- 2. PUNTOS CIRCULARES PROPORCIONADOS CON NÚCLEO ACÚSTICO (R=16, NÚCLEO=4) -->
    <g transform="translate(264, 122)">
      <circle cx="0" cy="0" r="16" fill="url(#neonV2)"/>
      <circle cx="0" cy="0" r="4.5" fill="#000000"/>
    </g>

    <g transform="translate(336, 122)">
      <circle cx="0" cy="0" r="16" fill="url(#neonV2)"/>
      <circle cx="0" cy="0" r="4.5" fill="#000000"/>
    </g>
  </g>

  <!-- LÍNEAS DE GUÍA TÉCNICAS -->
  <g stroke="#15202E" stroke-width="1" stroke-dasharray="2,3" opacity="0.6">
    <line x1="300" y1="50" x2="300" y2="550"/>
    <circle cx="300" cy="340" r="120" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.4"/>
    <circle cx="300" cy="340" r="146" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.4"/>
  </g>
</svg>
