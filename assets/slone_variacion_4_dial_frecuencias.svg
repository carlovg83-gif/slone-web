<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="neonV4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E3FF00"/>
      <stop offset="100%" stop-color="#9AD600"/>
    </linearGradient>

    <filter id="glowV4" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Máscara de Dial de 8 Fases -->
    <mask id="maskV4">
      <rect width="600" height="600" fill="#FFFFFF"/>
      
      <!-- Hueco interior (R=100) -->
      <circle cx="300" cy="340" r="100" fill="#000000"/>

      <!-- Muesca de ápice (R=8) -->
      <circle cx="300" cy="170" r="8" fill="#000000"/>

      <!-- Canal concéntrico central (R=135, ancho 5px) -->
      <circle cx="300" cy="340" r="135" fill="none" stroke="#000000" stroke-width="5"/>

      <!-- 8 Puentes de fase a 0°, 45°, 90°, 135°, 180°, 225°, 270°, 315° -->
      <g stroke="#FFFFFF" stroke-width="10">
        <line x1="300" y1="195" x2="300" y2="215"/>
        <line x1="300" y1="465" x2="300" y2="485"/>
        <line x1="155" y1="340" x2="175" y2="340"/>
        <line x1="425" y1="340" x2="445" y2="340"/>
        <line x1="198" y1="238" x2="212" y2="252"/>
        <line x1="388" y1="252" x2="402" y2="238"/>
        <line x1="198" y1="442" x2="212" y2="428"/>
        <line x1="388" y1="428" x2="402" y2="442"/>
      </g>

      <!-- Micro muescas perimetrales en los cuadrantes -->
      <circle cx="300" cy="510" r="5" fill="#000000"/>
      <circle cx="130" cy="340" r="5" fill="#000000"/>
      <circle cx="470" cy="340" r="5" fill="#000000"/>
    </mask>
  </defs>

  <rect width="600" height="600" fill="#000000"/>

  <g filter="url(#glowV4)">
    <!-- 1. ANILLO ACÚSTICO CON DIAL DE 8 FASES -->
    <circle cx="300" cy="340" r="170" fill="url(#neonV4)" mask="url(#maskV4)"/>

    <!-- 2. PUNTOS MICRO-CÁPSULA COMPACTOS PROPORCIONADOS (ANCHO 42px, ALTO 22px - PROPORCIÓN 2:1) -->
    <!-- Inclinados 6 grados concéntricamente, elegantes, sin sobrepeso -->
    <g transform="translate(262, 126) rotate(-6)">
      <rect x="-21" y="-11" width="42" height="22" rx="11" fill="url(#neonV4)"/>
    </g>

    <g transform="translate(338, 126) rotate(6)">
      <rect x="-21" y="-11" width="42" height="22" rx="11" fill="url(#neonV4)"/>
    </g>
  </g>

  <!-- LÍNEAS TÉCNICAS SUTILES -->
  <g stroke="#162232" stroke-width="1" stroke-dasharray="2,3" opacity="0.5">
    <line x1="300" y1="50" x2="300" y2="550"/>
    <circle cx="300" cy="340" r="135" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.4"/>
  </g>
</svg>
