<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradiente Neón Eléctrico SLÖNE -->
    <linearGradient id="neonV1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E3FF00"/>
      <stop offset="100%" stop-color="#AEE600"/>
    </linearGradient>

    <filter id="glowV1" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Máscara de Precisión para el Anillo y Canal Concéntrico -->
    <mask id="maskV1">
      <rect width="600" height="600" fill="#FFFFFF"/>
      
      <!-- Hueco interior (R=96) -->
      <circle cx="300" cy="340" r="96" fill="#000000"/>

      <!-- Muesca de ápice reducida y proporcionada (R=9) -->
      <circle cx="300" cy="170" r="9" fill="#000000"/>

      <!-- Canal concéntrico calibrado de 4.5px (no basto) -->
      <circle cx="300" cy="340" r="133" fill="none" stroke="#000000" stroke-width="4.5"/>

      <!-- Puentes del canal concéntrico a 90° y 45° -->
      <g stroke="#FFFFFF" stroke-width="8">
        <line x1="300" y1="200" x2="300" y2="215"/>
        <line x1="300" y1="465" x2="300" y2="480"/>
        <line x1="160" y1="340" x2="175" y2="340"/>
        <line x1="425" y1="340" x2="440" y2="340"/>
        <line x1="200" y1="240" x2="210" y2="250"/>
        <line x1="390" y1="250" x2="400" y2="240"/>
        <line x1="200" y1="440" x2="210" y2="430"/>
        <line x1="390" y1="430" x2="400" y2="440"/>
      </g>
    </mask>
  </defs>

  <!-- FONDO NEGRO PURO -->
  <rect width="600" height="600" fill="#000000"/>

  <!-- GRUPO PRINCIPAL -->
  <g filter="url(#glowV1)">
    <!-- 1. ANILLO ACÚSTICO PROPORCIONADO (R_ext=170, R_int=96) -->
    <circle cx="300" cy="340" r="170" fill="url(#neonV1)" mask="url(#maskV1)"/>

    <!-- 2. PUNTOS CIRCULARES AUTÉNTICOS Y PROPORCIONADOS (RADIO 15px, DIÁMETRO 30px) -->
    <!-- Proporción áurea respecto al anillo. Cero salchichas desproporcionadas -->
    <circle cx="266" cy="125" r="15" fill="url(#neonV1)"/>
    <circle cx="334" cy="125" r="15" fill="url(#neonV1)"/>
  </g>

  <!-- LÍNEAS GUÍA DE PRECISIÓN MILIMÉTRICA -->
  <g stroke="#162232" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
    <line x1="300" y1="60" x2="300" y2="540"/>
    <line x1="266" y1="125" x2="334" y2="125"/>
    <circle cx="300" cy="340" r="133" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.3"/>
  </g>
</svg>
